  function draw(){ctx.clearRect(0,0,W,H);sky();
    if(!L){ctx.fillStyle='rgba(255,255,255,0.03)';for(var g=0;g<6;g++){ctx.fillRect((g*90-(last*0.01)%90),H-GROUND-120,50,120);}}
    var art=ready(IMG.cap)&&ready(IMG.body);
    for(var i=0;i<pipes.length;i++){var p=pipes[i];
      if(L){flatPipe(p.x,0,p.gapY,'bottom');flatPipe(p.x,p.gapY+GAP,H-GROUND,'top');
        if(p.item&&!p.item.got){ctx.font='30px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(L.collectible,p.x+PIPE_W/2,p.gapY+GAP/2+Math.sin(last/200+i)*6);ctx.textBaseline='alphabetic';}
        continue;}
      if(art){pipeCol(p.x,0,p.gapY,'bottom');pipeCol(p.x,p.gapY+GAP,H-GROUND,'top');continue;}
      ctx.fillStyle=THEME.pipe;ctx.fillRect(p.x,0,PIPE_W,p.gapY);ctx.fillRect(p.x,p.gapY+GAP,PIPE_W,H-GROUND-(p.gapY+GAP));ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(p.x,p.gapY-14,PIPE_W,14);ctx.fillRect(p.x,p.gapY+GAP,PIPE_W,14);}
    ctx.fillStyle=L?L.ground:'#241428';ctx.fillRect(0,H-GROUND,W,GROUND);
    if(L){ctx.fillStyle=THEME.accent;ctx.fillRect(0,H-GROUND,W,4);}
    else if(ready(IMG.ground)){var gw=IMG.ground.naturalWidth*2,gh=IMG.ground.naturalHeight*2,off=state==='over'?0:(last*SPEED/1000)%gw;for(var gx=-off;gx<W;gx+=gw)ctx.drawImage(IMG.ground,gx,H-GROUND-gh*0.45,gw,gh);}
    else{ctx.fillStyle=THEME.accent;ctx.fillRect(0,H-GROUND,W,4);}
    ctx.save();ctx.translate(BIRD_X,bird.y);ctx.rotate(bird.rot);
    if(shield>0&&Math.floor(shield*10)%2)ctx.globalAlpha=0.35;
    if(hero){ctx.drawImage(hero,-32,-32,64,64);}
    else if(sprite&&sprite.complete&&sprite.naturalWidth>0){ctx.save();ctx.beginPath();ctx.arc(0,0,BIRD_R+4,0,7);ctx.clip();ctx.drawImage(sprite,-BIRD_R-8,-BIRD_R-8,(BIRD_R+8)*2,(BIRD_R+8)*2);ctx.restore();ctx.strokeStyle=THEME.accent;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,BIRD_R+4,0,7);ctx.stroke();}
    else if(ready(IMG.p0)){var fr=IMG['p'+(Math.floor(last/70)%3)];ctx.drawImage(tint(ready(fr)?fr:IMG.p0,THEME.bird),-27,-22,54,45);}
    else{ctx.fillStyle=THEME.bird;ctx.beginPath();ctx.arc(0,0,BIRD_R,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-5,5,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(8,-5,2.5,0,7);ctx.fill();ctx.fillStyle=THEME.accent;ctx.beginPath();ctx.moveTo(BIRD_R-2,0);ctx.lineTo(BIRD_R+9,-3);ctx.lineTo(BIRD_R+9,4);ctx.fill();}
    ctx.restore();
    ctx.fillStyle='#fff';ctx.font='bold 48px system-ui';ctx.textAlign='center';
    if(state==='play'){ctx.fillText(score,W/2,80);if(P.lives>1){ctx.font='22px system-ui';ctx.textAlign='left';ctx.fillText(Array(lives+1).join('♥'),14,34);ctx.textAlign='center';}}
    if(state==='ready'){ctx.font='bold 30px system-ui';ctx.fillText(THEME.title,W/2,H*0.28);ctx.font='16px system-ui';ctx.fillStyle=THEME.accent;ctx.fillText('Tap / Space to flap',W/2,H*0.28+34);}
    if(state==='over'){ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 40px system-ui';ctx.fillText('Game Over',W/2,H*0.4);ctx.font='22px system-ui';ctx.fillText('Score '+score+'   ·   Best '+best,W/2,H*0.4+40);ctx.font='16px system-ui';ctx.fillStyle=THEME.accent;ctx.fillText('Tap / Space to retry',W/2,H*0.4+78);}}
  requestAnimationFrame(loop);
  window.__game={get state(){return state;},get score(){return score;},get lives(){return lives;},play:P,flap:flap,peek:function(){var np=null;for(var i=0;i<pipes.length;i++){if(pipes[i].x+PIPE_W>BIRD_X-2){np=pipes[i];break;}}return{y:bird.y,target:np?np.gapY+GAP*0.5:H*0.42};}};
})();
</script></body></html>
