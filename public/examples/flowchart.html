<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosquito Life Cycle Diagram</title>
    <style>
        /* 
           RESET & LAYOUT 
           Resetting margins and ensuring the SVG fills the viewport.
           Using a dark theme for high contrast and visual appeal.
        */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* Dark background */
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Prevent scrolling, let SVG scale */
        }

        /* 
           SVG CONTAINER 
           Centers the diagram and makes it responsive.
        */
        .diagram-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 600px; /* Limit width on large screens */
            max-height: 90vh; /* Limit height on tall screens */
            background-color: #252525; /* Slightly lighter than page bg */
            border: 1px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        /* 
           SVG ELEMENT STYLES 
           Defined here to keep the SVG self-contained if copied.
        */
        .node-bg {
            fill: #e0e0e0;
            stroke: #555;
            stroke-width: 2;
            transition: fill 0.3s ease;
        }

        .node-bg:hover {
            fill: #ffffff;
        }

        .node-text {
            font-size: 14px;
            font-weight: 600;
            fill: #333333;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none; /* Let clicks pass through to node */
        }

        .arrow-path {
            fill: none;
            stroke: #888;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .arrow-head {
            fill: #888;
        }

        .stage-label {
            font-size: 12px;
            font-weight: bold;
            fill: #888;
            text-anchor: middle;
            letter-spacing: 1px;
        }

        /* 
           ANIMATION 
           Simple fade-in for the diagram elements.
        */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .anim-group {
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        .anim-group:nth-child(1) { animation-delay: 0.1s; }
        .anim-group:nth-child(2) { animation-delay: 0.3s; }
        .anim-group:nth-child(3) { animation-delay: 0.5s; }
        .anim-group:nth-child(4) { animation-group: 0.7s; }
        .anim-group:nth-child(5) { animation-delay: 0.9s; }

    </style>
</head>
<body>

    <div class="diagram-container">
        <!-- 
            SVG VIEWBOX: 0 0 400 800 
            Width: 400px (as requested)
            Height: 800px (to fit 4 stages + transitions vertically)
        -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" role="img" aria-label="Flowchart of the life cycle of a mosquito">
            
            <defs>
                <!-- Marker for Arrow Heads -->
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
                </marker>
                
                <!-- Shadow Filter for Nodes -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
                </filter>
            </defs>

            <!-- BACKGROUND GRID (Optional visual flair for technical look) -->
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#333" stroke-width="0.5"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#grid)" />

            <!-- 
                NODES & LABELS 
                Y coordinates: 100, 300, 500, 700
                X center: 200
            -->

            <!-- STAGE 1: EGG -->
            <g class="anim-group">
                <!-- Node Shape -->
                <rect x="120" y="80" width="160" height="60" rx="30" ry="30" class="node-bg" filter="url(#shadow)" />
                <!-- Text -->
                <text x="200" y="110" class="node-text">Egg</text>
                <!-- Stage Label -->
                <text x="200" y="70" class="stage-label">PHASE 1</text>
            </g>

            <!-- STAGE 2: LARVA -->
            <g class="anim-group">
                <!-- Node Shape -->
                <rect x="120" y="280" width="160" height="60" rx="30" ry="30" class="node-bg" filter="url(#shadow)" />
                <!-- Text -->
                <text x="200" y="310" class="node-text">Larva</text>
                <!-- Stage Label -->
                <text x="200" y="270" class="stage-label">PHASE 2</text>
            </g>

            <!-- STAGE 3: PUPA -->
            <g class="anim-group">
                <!-- Node Shape -->
                <rect x="120" y="480" width="160" height="60" rx="30" ry="30" class="node-bg" filter="url(#shadow)" />
                <!-- Text -->
                <text x="200" y="510" class="node-text">Pupa</text>
                <!-- Stage Label -->
                <text x="200" y="470" class="stage-label">PHASE 3</text>
            </g>

            <!-- STAGE 4: ADULT -->
            <g class="anim-group">
                <!-- Node Shape -->
                <rect x="120" y="680" width="160" height="60" rx="30" ry="30" class="node-bg" filter="url(#shadow)" />
                <!-- Text -->
                <text x="200" y="710" class="node-text">Adult</text>
                <!-- Stage Label -->
                <text x="200" y="670" class="stage-label">PHASE 4</text>
            </g>

            <!-- 
                ARROWS & TRANSITIONS 
                Connecting the nodes
            -->

            <!-- Arrow 1: Egg to Larva -->
            <g class="anim-group">
                <path d="M 200 140 L 200 280" class="arrow-path" marker-end="url(#arrowhead)" />
                <text x="210" y="215" font-size="10" fill="#aaa">Hatching</text>
            </g>

            <!-- Arrow 2: Larva to Pupa -->
            <g class="anim-group">
                <path d="M 200 340 L 200 480" class="arrow-path" marker-end="url(#arrowhead)" />
                <text x="210" y="415" font-size="10" fill="#aaa">Pupation</text>
            </g>

            <!-- Arrow 3: Pupa to Adult -->
            <g class="anim-group">
                <path d="M 200 540 L 200 680" class="arrow-path" marker-end="url(#arrowhead)" />
                <text x="210" y="615" font-size="10" fill="#aaa">Emergence</text>
            </g>

            <!-- Arrow 4: Adult to Egg (The Cycle) -->
            <!-- Path goes up the right side to close the loop -->
            <g class="anim-group">
                <path d="M 280 710 C 350 710, 350 110, 280 110" class="arrow-path" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
                <text x="330" y="410" font-size="10" fill="#aaa" text-anchor="middle">Laying</text>
            </g>

            <!-- Decorative "Water" indicators -->
            <g opacity="0.3">
                <path d="M 50 150 Q 100 140 150 150 T 250 150 T 350 150" fill="none" stroke="#4a90e2" stroke-width="2" />
                <path d="M 50 350 Q 100 340 150 350 T 250 350 T 350 350" fill="none" stroke="#4a90e2" stroke-width="2" />
                <path d="M 50 550 Q 100 540 150 550 T 250 550 T 350 550" fill="none" stroke="#4a90e2" stroke-width="2" />
            </g>

        </svg>
    </div>

    <!-- 
        JAVASCRIPT 
        No external libraries.
        Functionality:
        1. Dynamic SVG generation fallback (if needed, though static HTML is preferred).
        2. Simple interactivity: Clicking a node highlights it and shows a brief description.
    -->
    <script>
        (function() {
            // Select all nodes
            const nodes = document.querySelectorAll('.node-bg');
            const descriptions = {
                'Egg': 'Female mosquitoes lay eggs on the surface of stagnant water. They can float or be laid on damp surfaces.',
                'Larva': 'Larvae (wrigglers) live in water, feeding on organic matter. They breathe through a siphon.',
                'Pupa': 'Pupae (tumblers) do not feed. They are a transitional stage where metamorphosis occurs.',
                'Adult': 'Adult mosquitoes emerge from the water. Males feed on nectar; females require blood for egg development.'
            };

            // Add click event listeners
            nodes.forEach(node => {
                node.style.cursor = 'pointer';
                node.addEventListener('click', function(e) {
                    // Remove active class from all
                    nodes.forEach(n => n.style.stroke = '#555');
                    
                    // Add active class to clicked
                    this.style.stroke = '#4a90e2';
                    this.style.strokeWidth = '3';

                    // Get text content of the sibling text node
                    const textNode = this.nextElementSibling;
                    const stageName = textNode.textContent;

                    // Simple alert for description (as per "no external assets" constraint)
                    // In a real app, this would update a side-panel.
                    // Using a styled div overlay instead of alert for better UX.
                    let existingInfo = document.getElementById('info-box');
                    if(existingInfo) existingInfo.remove();

                    const infoBox = document.createElement('div');
                    infoBox.id = 'info-box';
                    infoBox.style.position = 'absolute';
                    infoBox.style.bottom = '20px';
                    infoBox.style.left = '50%';
                    infoBox.style.transform = 'translateX(-50%)';
                    infoBox.style.background = '#333';
                    infoBox.style.color = '#fff';
                    infoBox.style.padding = '10px 20px';
                    infoBox.style.borderRadius = '4px';
                    infoBox.style.fontSize = '14px';
                    infoBox.style.textAlign = 'center';
                    infoBox.style.boxShadow = '0 2px 10px rgba(0,0,0,0.5)';
                    infoBox.style.transition = 'opacity 0.3s';
                    infoBox.style.zIndex = '10';
                    
                    infoBox.textContent = `${stageName}: ${descriptions[stageName]}`;
                    document.body.appendChild(infoBox);

                    // Auto-hide after 4 seconds
                    setTimeout(() => {
                        infoBox.style.opacity = '0';
                        setTimeout(() => {
                            if(infoBox.parentNode) infoBox.remove();
                        }, 300);
                    }, 4000);
                });
            });
        })();
    </script>
</body>
</html>
